<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>觀察清單</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <script src="theme-boot.js"></script>
  </head>
  <body>
    <header class="topbar">
      <h1>觀察清單</h1>
      <div id="topbar-actions">
        <span id="signin-hint" class="tip-anchor" hidden>
          <button id="signin-button" type="button" class="icon-button cloud-alert" aria-label="登入以同步觀察清單" aria-describedby="signin-tip"></button>
          <span id="signin-tip" class="tip tip-below" role="tooltip"></span>
        </span>
        <button id="menu-button" type="button" class="icon-button" popovertarget="menu" aria-label="設定選單" aria-haspopup="menu"></button>
      </div>
    </header>
    <div id="menu" class="menu" popover role="menu" aria-label="設定選單"></div>

    <nav id="market-tabs" class="tabs" aria-label="分頁"></nav>

    <div class="columns" aria-hidden="true">
      <span>代碼</span>
      <span class="cell">最新價</span>
      <span class="cell">漲跌</span>
      <span class="cell">漲跌%</span>
    </div>

    <main id="groups"></main>

    <div id="message-bar"></div>
    <footer class="statusbar">
      <span id="app-version"></span>
      <span aria-hidden="true">·</span>
      <a id="privacy-link" target="_blank" rel="noopener">隱私權政策</a>
      <span aria-hidden="true">·</span>
      <a class="contact" href="mailto:xingyen0613@gmail.com">xingyen0613@gmail.com</a>
      <span id="update-info" class="tip-anchor" hidden>
        <span id="update-time" tabindex="0" aria-describedby="source-tip"></span>
        <span id="source-tip" class="tip tip-above" role="tooltip"></span>
      </span>
    </footer>
    <input id="import-file" type="file" accept=".json,application/json" hidden />

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
