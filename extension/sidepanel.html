<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>觀察清單</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>觀察清單</h1>
      <div id="topbar-actions"></div>
    </header>

    <nav id="market-tabs" class="tabs" aria-label="分頁"></nav>

    <div class="columns" aria-hidden="true">
      <span>代碼</span>
      <span class="cell">最新價</span>
      <span class="cell">漲跌</span>
      <span class="cell">漲跌%</span>
    </div>

    <main id="groups"></main>

    <footer class="statusbar">
      <p id="status-error" class="status-error"></p>
      <p id="status"></p>
      <details id="settings">
        <summary>設定</summary>
        <div id="sharing-setting">
          <label class="check-row"><input id="sharing-toggle" type="checkbox" />匿名分享觀察清單</label>
          <p class="hint">
            關閉後停止上傳，已上傳的資料不會刪除。
            <a id="sharing-privacy" target="_blank" rel="noopener">隱私權政策</a>
          </p>
        </div>
        <div id="transfer-setting">
          <p class="setting-title">備份與分享</p>
          <div class="transfer-row" role="radiogroup" aria-label="匯出範圍">
            <span>匯出範圍</span>
            <label class="check-row"><input type="radio" name="export-scope" value="all" checked />整份清單</label>
            <label class="check-row"><input type="radio" name="export-scope" value="tab" />目前分頁</label>
          </div>
          <div class="transfer-row">
            <button id="export-button" type="button" class="text-button">匯出檔案</button>
            <button id="import-button" type="button" class="text-button">從檔案匯入</button>
            <input id="import-file" type="file" accept=".json,application/json" hidden />
          </div>
          <p class="hint">匯出的 JSON 檔可以備份，或分享給別人匯入。匯入會加在現有清單後面，不會蓋掉任何東西。</p>
          <p id="transfer-message" class="hint" role="status"></p>
        </div>
        <form id="keys-form">
          <p class="hint">
            沒有 key 時，台股用 TWSE MIS，美股用 Yahoo。Key 只存在這台電腦，不會同步。
          </p>
          <label>Fugle API key<input id="key-fugle" type="password" autocomplete="off" /></label>
          <label>Alpaca Key ID<input id="key-alpaca-id" type="password" autocomplete="off" /></label>
          <label>Alpaca Secret<input id="key-alpaca-secret" type="password" autocomplete="off" /></label>
          <div class="form-actions">
            <button type="submit" class="text-button primary">儲存</button>
            <span id="keys-saved" class="hint" role="status"></span>
          </div>
        </form>
      </details>
    </footer>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
