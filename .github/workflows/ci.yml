name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # No dependencies and no package-lock.json, so there is no install step and no npm cache.
      # The unit tests stub fetch with fixtures in test/fixtures, so they need no network.
      # e2e/ is not run here: it needs Chromium and the private MultiList-server repo.
      - run: npm test
